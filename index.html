<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calc-page">
        <div class="calculator">
          <div class="calc-header">
            <h1>Calculator</h1>
            <span class="calc-header-subtle">Simple</span>
          </div>

          <!---Display--->
        <div class="calc-display">
            <div class="display-history" id="displayHistory"></div>
            <div class="display-current" id="displayCurrent">0</div>
        </div>

          <!---Buttons--->
        <div class="calc-buttons">
        <!---baris 1--->
          <button class="btn btn-fuction">AC</button>
          <button class="btn btn-fuction">DEL</button>
          <button class="btn btn-fuction">%</button>
          <button class="btn btn-fuction">/</button>
        <!---baris 2--->
          <button class="btn btn-number">7</button>
          <button class="btn btn-number">8</button>
          <button class="btn btn-number">9</button>
          <button class="btn btn-fuction">*</button>
        <!---baris 3--->
          <button class="btn btn-number">4</button>
          <button class="btn btn-number">5</button>
          <button class="btn btn-number">6</button>
          <button class="btn btn-fuction">-</button>
        <!---baris 4--->
          <button class="btn btn-number">1</button>
          <button class="btn btn-number">2</button>
          <button class="btn btn-number">3</button>
          <button class="btn btn-fuction">+</button>
        <!---baris 5--->
          <button class="btn btn-number zero-btn">0</button>
          <button class="btn btn-fuction">.</button>
          <button class="btn btn-equals">=</button>
        </div>

      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
